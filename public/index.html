<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION | Bot Controller</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #09090b; --card: #18181b; --accent: #00ff9d; --text: #e4e4e7; --danger: #ef4444; --dim: #71717a; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* --- MOBILE HEADER (HAMBURGER) --- */
        .mobile-header {
            display: none; /* Hidden on desktop */
            position: fixed; top: 0; left: 0; right: 0;
            height: 60px; background: var(--card);
            border-bottom: 1px solid #333;
            z-index: 1000;
            padding: 0 20px;
            align-items: center;
            justify-content: space-between;
        }
        .hamburger { font-size: 24px; cursor: pointer; color: var(--accent); }

        /* --- SIDEBAR --- */
        .sidebar { 
            width: 250px; background: var(--card); padding: 20px; 
            border-right: 1px solid #333; display: flex; flex-direction: column; 
            transition: transform 0.3s ease;
            z-index: 999;
        }
        
        .logo { font-size: 24px; font-weight: 800; color: var(--accent); margin-bottom: 40px; letter-spacing: 2px; }
        .menu-item { padding: 15px; cursor: pointer; border-radius: 10px; margin-bottom: 5px; color: var(--dim); transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .menu-item:hover, .menu-item.active { background: #27272a; color: var(--text); }
        .menu-item.active { border-left: 3px solid var(--accent); }
        
        /* SYSTEM STATS */
        .sys-stats { margin-top: auto; padding: 15px; background: #000; border-radius: 10px; font-size: 12px; }
        .stat-bar { height: 4px; background: #333; margin-top: 5px; border-radius: 2px; overflow: hidden; }
        .stat-fill { height: 100%; background: var(--accent); width: 0%; transition: 1s; }

        /* --- MAIN CONTENT --- */
        .main { flex: 1; padding: 30px; overflow-y: auto; position: relative; }
        .section { display: none; animation: fadeIn 0.3s; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- RESPONSIVE DESIGN --- */
        @media (max-width: 768px) {
            .mobile-header { display: flex; }
            .sidebar {
                position: fixed; top: 60px; left: 0; bottom: 0;
                transform: translateX(-100%); /* Hide by default */
                width: 80%; max-width: 300px;
                border-right: 1px solid var(--accent);
            }
            .sidebar.open { transform: translateX(0); } /* Show when open */
            .main { padding-top: 80px; } /* Push content down */
            
            /* Overlay to close menu when clicking outside */
            .overlay {
                display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                background: rgba(0,0,0,0.7); z-index: 900;
            }
            .overlay.active { display: block; }
        }

        /* CONSOLE & UI ELEMENTS */
        .bot-card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
        .status-dot { height: 10px; width: 10px; background: #333; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
        .stopped { background: var(--danger); }
        
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; margin: 5px; transition: 0.2s; font-size: 12px; }
        .btn-start { background: rgba(0, 255, 157, 0.1); color: var(--accent); }
        .btn-stop { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .btn-restart { background: #333; color: #fff; }
        
        .terminal { background: #000; padding: 20px; border-radius: 10px; height: 400px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #ccc; border: 1px solid #333; margin-top: 20px; }
        .log-line { margin: 2px 0; border-bottom: 1px solid #111; word-wrap: break-word; }
        .log-err { color: #ff5555; }
        .log-out { color: #00ff9d; }

        .upload-zone { border: 2px dashed #444; padding: 40px; text-align: center; border-radius: 15px; cursor: pointer; transition: 0.3s; }
        input[type="text"], textarea { width: 100%; background: #000; border: 1px solid #333; padding: 15px; color: #fff; border-radius: 5px; margin-top: 10px; box-sizing: border-box; }
        select { width: 100%; background: #000; border: 1px solid #333; padding: 15px; color: #fff; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <!-- Mobile Top Bar -->
    <div class="mobile-header">
        <div class="logo" style="margin:0; font-size: 18px;">ORION</div>
        <i class="fas fa-bars hamburger" onclick="toggleSidebar()"></i>
    </div>

    <!-- Dark Overlay for Mobile -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar Menu -->
    <div class="sidebar" id="sidebar">
        <div class="logo mobile-hidden"><i class="fas fa-rocket"></i> ORION</div>
        
        <div class="menu-item active" onclick="showTab('console')"><i class="fas fa-terminal"></i> Console</div>
        <div class="menu-item" onclick="showTab('files')"><i class="fas fa-folder"></i> Deploy</div>
        <div class="menu-item" onclick="showTab('settings')"><i class="fas fa-cog"></i> Editor</div>
        
        <div class="sys-stats">
            <div>CPU <span id="cpu-val">0%</span></div>
            <div class="stat-bar"><div class="stat-fill" id="cpu-bar"></div></div>
            <br>
            <div>RAM <span id="ram-val">0GB</span></div>
            <div class="stat-bar"><div class="stat-fill" id="ram-bar"></div></div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="main">
        
        <!-- CONSOLE TAB -->
        <div id="console" class="section active">
            <h2>Active Bots</h2>
            <div id="bot-list">Loading bots...</div>
            
            <h3>Live Logs</h3>
            <div class="terminal" id="terminal">
                <div class="log-line">Waiting for logs...</div>
            </div>
        </div>

        <!-- FILES TAB -->
        <div id="files" class="section">
            <h2>Deploy New Bot</h2>
            <div class="upload-zone" onclick="document.getElementById('zipInput').click()">
                <i class="fas fa-cloud-upload-alt" style="font-size: 40px; color: var(--accent)"></i>
                <p>Click to Upload .ZIP file</p>
                <input type="file" id="zipInput" hidden accept=".zip">
            </div>
            <input type="text" id="deployName" placeholder="Enter Folder Name (e.g. megabot)">
            <button class="btn btn-restart" style="width:100%; margin:10px 0;" onclick="uploadFile()">DEPLOY & UNZIP</button>
        </div>

        <!-- SETTINGS TAB -->
        <div id="settings" class="section">
            <h2>Environment Editor</h2>
            <p style="color:var(--dim); font-size: 13px;">Select a folder to edit its .env file</p>
            <select id="folderSelect" onchange="loadEnv()"></select>
            <textarea id="envEditor" rows="15" placeholder="BOT_TOKEN=..."></textarea>
            <button class="btn btn-start" style="width:100%; margin:10px 0;" onclick="saveEnv()">SAVE .ENV</button>
        </div>
    </div>

    <script>
        const socket = io();

        // --- MOBILE MENU TOGGLE ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        // --- TABS LOGIC ---
        function showTab(id) {
            // Update Menu Active State
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
            
            // Show Section
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');

            // Close sidebar on mobile after clicking
            if(window.innerWidth <= 768) toggleSidebar();
        }

        // --- SYSTEM STATS ---
        socket.on('sys-stats', data => {
            document.getElementById('cpu-val').innerText = data.cpu + '%';
            document.getElementById('cpu-bar').style.width = data.cpu + '%';
            document.getElementById('ram-val').innerText = `${data.ramUsed} / ${data.ramTotal} GB`;
            document.getElementById('ram-bar').style.width = (data.ramUsed / data.ramTotal * 100) + '%';
        });

        // --- LIVE LOGS ---
        socket.on('log', data => {
            const term = document.getElementById('terminal');
            const line = document.createElement('div');
            line.className = `log-line ${data.type === 'err' ? 'log-err' : 'log-out'}`;
            line.innerText = `[${data.app}] ${data.data}`;
            term.appendChild(line);
            term.scrollTop = term.scrollHeight;
        });

        // --- BOT LIST ---
        async function loadBots() {
            try {
                const res = await fetch('/api/status');
                const bots = await res.json();
                const container = document.getElementById('bot-list');
                container.innerHTML = '';
                
                if(bots.length === 0) container.innerHTML = '<p style="color:#666">No bots running.</p>';

                bots.forEach(bot => {
                    const statusClass = bot.status === 'online' ? 'online' : 'stopped';
                    container.innerHTML += `
                        <div class="bot-card">
                            <div style="margin-bottom:10px;">
                                <span class="status-dot ${statusClass}"></span>
                                <strong style="font-size:16px;">${bot.name}</strong>
                                <div style="color:#666; font-size:12px; margin-top:5px;">
                                    RAM: ${bot.memory} | ID: ${bot.id}
                                </div>
                            </div>
                            <div style="display:flex; flex-wrap:wrap;">
                                <button class="btn btn-start" onclick="action('${bot.name}', 'start')">START</button>
                                <button class="btn btn-restart" onclick="action('${bot.name}', 'restart')">RESTART</button>
                                <button class="btn btn-stop" onclick="action('${bot.name}', 'stop')">STOP</button>
                            </div>
                        </div>
                    `;
                });
            } catch(e) { console.error("API Error"); }
        }
        setInterval(loadBots, 3000);
        loadBots();

        async function action(name, act) {
            await fetch('/api/action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, action: act })
            });
            loadBots();
        }

        // --- FILE UPLOAD ---
        async function uploadFile() {
            const file = document.getElementById('zipInput').files[0];
            const name = document.getElementById('deployName').value;
            if(!file || !name) return alert("Please select a ZIP file and enter a folder name.");

            const formData = new FormData();
            formData.append('file', file);
            formData.append('folderName', name);

            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "UPLOADING...";
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                alert(data.message || data.error);
            } catch(e) { alert("Upload failed"); }
            
            btn.innerText = originalText;
            btn.disabled = false;
            loadFolders();
        }

        // --- ENV EDITOR ---
        async function loadFolders() {
            try {
                const res = await fetch('/api/files');
                const dirs = await res.json();
                const sel = document.getElementById('folderSelect');
                sel.innerHTML = dirs.map(d => `<option value="${d}">${d}</option>`).join('');
            } catch(e) {}
        }
        
        async function saveEnv() {
            const folder = document.getElementById('folderSelect').value;
            const content = document.getElementById('envEditor').value;
            if(!folder) return alert("No folder selected");
            
            await fetch('/api/save-env', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ folder, content })
            });
            alert("Configuration Saved!");
        }
        
        loadFolders();
    </script>
</body>
</html>
